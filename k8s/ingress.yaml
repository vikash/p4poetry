apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p4poetry-ingress
  namespace: p4poetry
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - p4poetry.com
        - www.p4poetry.com
      secretName: p4poetry-tls
  rules:
    - host: p4poetry.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: p4poetry
                port:
                  number: 80
    - host: www.p4poetry.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: p4poetry
                port:
                  number: 80
