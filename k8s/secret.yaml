# Template - DO NOT commit with real values
# Create actual secret with:
#   kubectl create secret generic p4poetry-db-secret \
#     --namespace=p4poetry \
#     --from-literal=DB_HOST=<cloudsql-ip> \
#     --from-literal=DB_USER=<username> \
#     --from-literal=DB_PASSWORD=<password> \
#     --from-literal=DB_NAME=p4poetry
#
# Or apply this template after base64 encoding values:
#   echo -n 'value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: p4poetry-db-secret
  namespace: p4poetry
type: Opaque
data:
  DB_HOST: <base64-encoded-host>
  DB_USER: <base64-encoded-user>
  DB_PASSWORD: <base64-encoded-password>
  DB_NAME: cDRwb2V0cnk=  # p4poetry
